<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>英语单词闪卡 · 生词本 & 测试</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), 0 6px 12px rgba(0,0,0,0.05);
            padding: 24px 20px 32px;
            transition: all 0.2s;
        }

        /* 顶部导航 + 课程切换 */
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px 6px;
            margin-bottom: 22px;
        }

        .course-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .course-btn {
            background: #eef2f7;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #1e293b;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .course-btn.active {
            background: #1e293b;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .course-btn:active { transform: scale(0.96); }

        .nav-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid #dce3ed;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.15s;
            background: white;
        }

        .icon-btn:active { background: #e9edf3; }
        .icon-btn.star-btn { border-color: #fbbf24; color: #b45309; }
        .icon-btn.star-btn.active { background: #fef3c7; border-color: #f59e0b; }

        /* 卡片区域 */
        .flashcard-wrapper {
            perspective: 1200px;
            margin: 12px 0 18px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            padding-bottom: 70%; /* 3:2 比例 */
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            border-radius: 32px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.04);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 32px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 18px;
            background: white;
            border: 1px solid #eef2f7;
            box-shadow: 0 8px 18px rgba(0,0,0,0.02);
            text-align: center;
        }

        .card-front {
            background: linear-gradient(145deg, #ffffff, #fafcff);
        }

        .card-back {
            transform: rotateY(180deg);
            background: #f8faff;
            border: 1px solid #dce3ed;
        }

        .word-en {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #0b1e33;
            line-height: 1.2;
            word-break: break-word;
        }

        .word-phonetic {
            font-size: 1.2rem;
            color: #4b5b6e;
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .word-meaning {
            font-size: 2rem;
            font-weight: 500;
            color: #0b1e33;
            word-break: break-word;
            padding: 0 6px;
        }

        .word-part-of-speech {
            font-size: 1rem;
            color: #64748b;
            margin-top: 6px;
        }

        .card-hint {
            margin-top: 12px;
            font-size: 0.75rem;
            color: #94a3b8;
            letter-spacing: 0.3px;
            border-top: 1px dashed #e2e8f0;
            padding-top: 12px;
            width: 70%;
        }

        /* 底部控制栏 */
        .bottom-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 6px;
        }

        .left-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .right-group {
            display: flex;
            gap: 8px;
        }

        .ctrl-btn {
            background: white;
            border: 1px solid #dce3ed;
            border-radius: 30px;
            padding: 8px 18px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #1e293b;
            cursor: pointer;
            transition: 0.12s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .ctrl-btn:active { background: #eef2f7; transform: scale(0.96); }
        .ctrl-btn.primary { background: #1e293b; color: white; border-color: #1e293b; }
        .ctrl-btn.primary:active { background: #0f172a; }

        /* 生词本弹出 */
        .modal-overlay {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(2px);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.open { display: flex; }

        .modal-box {
            background: white;
            max-width: 440px;
            width: 92%;
            max-height: 70vh;
            border-radius: 36px;
            padding: 24px 20px 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: #64748b;
        }

        .word-list {
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }

        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4px;
            border-bottom: 1px solid #eef2f7;
        }

        .word-item span { font-weight: 500; }
        .remove-word {
            background: none;
            border: none;
            color: #b91c1c;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 30px;
            background: #fee2e2;
            font-size: 0.8rem;
        }

        .empty-msg { color: #94a3b8; text-align: center; padding: 30px 0; }

        /* 测试模式 */
        .test-area {
            margin-top: 20px;
            border-top: 2px dashed #e2e8f0;
            padding-top: 20px;
            display: none;
        }

        .test-area.active { display: block; }

        .test-prompt {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .test-word {
            font-size: 2rem;
            font-weight: 700;
            color: #0b1e33;
        }

        .test-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 12px 0;
        }

        .test-opt {
            background: white;
            border: 1px solid #dce3ed;
            border-radius: 40px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
            min-width: 100px;
        }

        .test-opt:active { background: #eef2f7; }
        .test-opt.correct { background: #bbf7d0; border-color: #22c55e; }
        .test-opt.wrong { background: #fecaca; border-color: #ef4444; }

        .test-feedback {
            font-weight: 500;
            margin-top: 6px;
            min-height: 2rem;
        }

        /* 自适应 */
        @media (max-width: 500px) {
            .app-container { padding: 16px; }
            .word-en { font-size: 1.8rem; }
            .word-meaning { font-size: 1.6rem; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .course-selector { justify-content: center; }
            .nav-actions { justify-content: center; }
            .bottom-controls { flex-direction: column; align-items: stretch; }
            .left-group, .right-group { justify-content: center; }
            .ctrl-btn { flex: 1; justify-content: center; }
        }
    </style>
</head>

    <!-- 卡片 -->
    <div class="flashcard-wrapper" id="cardWrapper">

            <div class="card-face card-back" id="backFace">
                <div class="word-meaning" id="wordMeaning">谜</div>
                <div class="word-part-of-speech" id="wordPos">n.</div>
            </div>
        </div>
    </div>

    <!-- 底部 -->
    <div class="bottom-controls">
        <div class="left-group">
            <button class="ctrl-btn" id="prevBtn">◀ 上一个</button>
            <button class="ctrl-btn" id="nextBtn">下一个 ▶</button>
            <button class="ctrl-btn" id="randomBtn">🎲 随机</button>
        </div>
        <div class="right-group">
            <button class="ctrl-btn" id="testToggleBtn">📝 测试</button>
        </div>
    </div>

    <!-- 测试区域 -->
    <div class="test-area" id="testArea">
        <div class="test-prompt">
            <div class="test-word" id="testWord">mystery</div>
            <div class="test-options" id="testOptions"></div>
            <div class="test-feedback" id="testFeedback"></div>
        </div>
    </div>

    <!-- 生词本模态 -->
    <div class="modal-overlay" id="bookmarkModal">
        <div class="modal-box">
            <div class="modal-header">
                <span>⭐ 生词本</span>
                <button class="modal-close" id="closeBookmark">&times;</button>
            </div>
            <div class="word-list" id="bookmarkList"></div>
        </div>
    </div>
</div>

                { word: "giant", phonetic: "/ˈdʒaɪənt/", meaning: "巨大的；巨人", pos: "adj./n." },
                { word: "hailstone", phonetic: "/ˈheɪlstəʊn/", meaning: "冰雹", pos: "n." },
                { word: "raindrop", phonetic: "/ˈreɪndrɒp/", meaning: "雨滴", pos: "n." },
                { word: "increase", phonetic: "/ɪnˈkriːs/", meaning: "增加", pos: "v." },
                { word: "result", phonetic: "/rɪˈzʌlt/", meaning: "结果", pos: "n." },
                { word: "skull", phonetic: "/skʌl/", meaning: "颅骨，头骨", pos: "n." }
            ]
        };

        // ---------- 全局状态 ----------
        let currentUnit = 'Unit1A';
        let currentWordIndex = 0;
        let words = COURSE_DATA['Unit1A'] || [];
        let isFlipped = false;
        let bookmark = JSON.parse(localStorage.getItem('wordBookmark') || '[]');
        let isTestMode = false;
        let testWordIndex = 0;
        let testOptions = [];

        // DOM 引用
        const cardWrapper = document.getElementById('cardWrapper');
        const flashcard = document.getElementById('flashcard');
        const wordEn = document.getElementById('wordEn');
        const wordPhonetic = document.getElementById('wordPhonetic');
        const wordMeaning = document.getElementById('wordMeaning');
        const wordPos = document.getElementById('wordPos');
        const starBtn = document.getElementById('starBtn');
        const bookmarkBtn = document.getElementById('bookmarkBtn');
        const modal = document.getElementById('bookmarkModal');
        const closeBookmark = document.getElementById('closeBookmark');
        const bookmarkList = document.getElementById('bookmarkList');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const randomBtn = document.getElementById('randomBtn');
        const testToggleBtn = document.getElementById('testToggleBtn');
        const testArea = document.getElementById('testArea');
        const testWord = document.getElementById('testWord');
        const testOptionsDiv = document.getElementById('testOptions');
        const testFeedback = document.getElementById('testFeedback');

        // ---------- 辅助 ----------
        function updateCard() {
            if (!words.length) return;
            const w = words[currentWordIndex];
            wordEn.textContent = w.word || '';
            wordPhonetic.textContent = w.phonetic || '';
            wordMeaning.textContent = w.meaning || '';
            wordPos.textContent = w.pos || '';
            // 翻转状态重置
            if (isFlipped) {
                flashcard.classList.remove('flipped');
                isFlipped = false;
            }
            updateStar();
            // 自动朗读 (英文)
            speakWord(w.word);
        }

        function speakWord(text) {
            if (!text) return;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                speechSynthesis.cancel();
                speechSynthesis.speak(utterance);
            }
        }

        function updateStar() {
            const w = words[currentWordIndex];
            if (!w) return;
            const isStarred = bookmark.some(b => b.word === w.word && b.unit === currentUnit);
            starBtn.textContent = isStarred ? '⭐' : '☆';
            starBtn.classList.toggle('active', isStarred);
        }

        function toggleBookmark() {
            const w = words[currentWordIndex];
            if (!w) return;
            const idx = bookmark.findIndex(b => b.word === w.word && b.unit === currentUnit);
            if (idx >= 0) {
                bookmark.splice(idx, 1);
            } else {
                bookmark.push({ word: w.word, unit: currentUnit, meaning: w.meaning, phonetic: w.phonetic });
            }
            localStorage.setItem('wordBookmark', JSON.stringify(bookmark));
            updateStar();
        }

        function renderBookmarkModal() {
            if (!bookmark.length) {
                bookmarkList.innerHTML = '<div class="empty-msg">✨ 还没有收藏单词</div>';
                return;
            }
            bookmarkList.innerHTML = bookmark.map((item, i) => `
                <div class="word-item">
                    <span>${item.word} <span style="color:#64748b;font-weight:400;">${item.meaning}</span></span>
                    <button class="remove-word" data-index="${i}">移除</button>
                </div>
            `).join('');
            // 移除事件
            document.querySelectorAll('.remove-word').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.dataset.index, 10);
                    bookmark.splice(idx, 1);
                    localStorage.setItem('wordBookmark', JSON.stringify(bookmark));
                    renderBookmarkModal();
                    updateStar();
                });
            });
        }

        function switchUnit(unit) {
            currentUnit = unit;
            words = COURSE_DATA[unit] || [];
            if (!words.length) words = COURSE_DATA['Unit1A'];
            currentWordIndex = 0;
            isFlipped = false;
            flashcard.classList.remove('flipped');
            updateCard();
            // 更新课程按钮高亮
            document.querySelectorAll('.course-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.unit === unit);
            });
            // 若测试模式开启则刷新测试
            if (isTestMode) initTest();
        }

        // 随机跳转 (当前课程)
        function randomWord() {
            if (words.length < 2) return;
            let newIdx;
            do {
                newIdx = Math.floor(Math.random() * words.length);
            } while (newIdx === currentWordIndex && words.length > 1);
            currentWordIndex = newIdx;
            updateCard();
        }

        // ---------- 测试逻辑 ----------
        function initTest() {
            if (!words.length) return;
            testWordIndex = Math.floor(Math.random() * words.length);
            generateTest();
        }

        function generateTest() {
            const correct = words[testWordIndex];
            if (!correct) return;
            // 随机选两个不同单词的释义 (包括正确)
            let candidates = [correct];
            let pool = words.filter((_, i) => i !== testWordIndex);
            // 打乱取两个
            const shuffled = pool.sort(() => Math.random() - 0.5);
            for (let i = 0; i < Math.min(2, shuffled.length); i++) {
                candidates.push(shuffled[i]);
            }
            // 打乱选项
            candidates = candidates.sort(() => Math.random() - 0.5);
            testOptions = candidates.map(w => w.meaning);
            testWord.textContent = correct.word;
            testOptionsDiv.innerHTML = testOptions.map(opt => 
                `<button class="test-opt" data-meaning="${opt}">${opt}</button>`
            ).join('');
            testFeedback.textContent = '';
            // 绑定事件
            document.querySelectorAll('.test-opt').forEach(btn => {
                btn.addEventListener('click', function() {
                    const selected = this.dataset.meaning;
                    const isCorrect = selected === correct.meaning;
                    if (isCorrect) {
                        this.classList.add('correct');
                        testFeedback.textContent = '✅ 正确！';
                        testFeedback.style.color = '#16a34a';
                        setTimeout(() => {
                            initTest(); // 下一题
                        }, 600);
                    } else {
                        this.classList.add('wrong');
                        testFeedback.textContent = `❌ 正确答案是: ${correct.meaning}`;
                        testFeedback.style.color = '#dc2626';
                        // 自动下一题 (稍慢)
                        setTimeout(() => {
                            initTest();
                        }, 1200);
                    }
                    // 禁用所有选项避免重复点击
                    document.querySelectorAll('.test-opt').forEach(b => b.disabled = true);
                });
            });
        }

        // ---------- 事件绑定 ----------
        // 课程切换
        document.querySelectorAll('.course-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const unit = this.dataset.unit;
                if (unit === currentUnit) return;
                switchUnit(unit);
                if (isTestMode) initTest();
            });
        });

        // 卡片翻转 (点击卡片)
        cardWrapper.addEventListener('click', function(e) {
            // 如果点击的是按钮则忽略
            if (e.target.closest('.icon-btn') || e.target.closest('.ctrl-btn')) return;
            isFlipped = !isFlipped;
            flashcard.classList.toggle('flipped', isFlipped);
        });

        // 点击单词朗读 (仅英文)
        wordEn.addEventListener('click', function(e) {
            e.stopPropagation();
            const w = words[currentWordIndex];
            if (w) speakWord(w.word);
        });

        // 星号按钮
        starBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleBookmark();
        });

        // 生词本
        bookmarkBtn.addEventListener('click', function() {
            renderBookmarkModal();
            modal.classList.add('open');
        });
        closeBookmark.addEventListener('click', function() {
            modal.classList.remove('open');
        });
        modal.addEventListener('click', function(e) {
            if (e.target === modal) modal.classList.remove('open');
        });

        // 上一/下一/随机
        prevBtn.addEventListener('click', function() {
            if (!words.length) return;
            currentWordIndex = (currentWordIndex - 1 + words.length) % words.length;
            updateCard();
        });
        nextBtn.addEventListener('click', function() {
            if (!words.length) return;
            currentWordIndex = (currentWordIndex + 1) % words.length;
            updateCard();
        });
        randomBtn.addEventListener('click', randomWord);

        // 测试切换
        testToggleBtn.addEventListener('click', function() {
            isTestMode = !isTestMode;
            testArea.classList.toggle('active', isTestMode);
            if (isTestMode) {
                initTest();
            } else {
                testFeedback.textContent = '';
                testOptionsDiv.innerHTML = '';
            }
        });

        // 初始化
        switchUnit('Unit1A');
    })();
</script>
